<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAMEHUB — Авторизация</title><link rel="stylesheet" href="style.css"></head>
<body data-page="auth"><header class="site-header auth-header"><a class="brand" href="index.html"><span class="brand-mark">G</span><span>GAMEHUB</span></a><a class="btn btn-ghost" href="index.html">На главную</a></header>
<main class="auth-shell"><div class="auth-card"><div class="auth-tabs"><button id="loginTab" class="tab active">Войти</button><button id="registerTab" class="tab">Регистрация</button></div><div class="auth-heading"><span class="eyebrow">ACCOUNT</span><h1 id="authTitle">С возвращением</h1><p id="authSubtitle">Войдите в свой аккаунт или продолжите как гость.</p></div><div class="form-message hidden" id="authMessage"></div>
<form id="authForm" novalidate><label class="field"><span>Username</span><input id="username" maxlength="24" autocomplete="username" required placeholder="Ваш username"></label><label class="field"><span>Пароль</span><div class="password-wrap"><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="Минимум 6 символов"><button type="button" class="password-toggle" data-target="password">Показать</button></div></label>
<div id="confirmRow" class="hidden"><label class="field"><span>Подтвердить пароль</span><div class="password-wrap"><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Повторите пароль"><button type="button" class="password-toggle" data-target="confirmPassword">Показать</button></div></label></div>
<button class="btn btn-primary btn-full btn-large" type="submit" id="submitAuth">ВОЙТИ</button></form><button class="guest-link" id="guestButton">Продолжить как гость →</button><p class="auth-disclaimer">Демонстрационная статическая версия: данные аккаунтов хранятся только в браузере через localStorage.</p></div></main>
<script src="js/auth.js"></script></body></html>
